spring.application.name=boardroom-booking-backend
spring.profiles.active=dev

# --- Reactive web server (Netty) ---
# WebFlux replaces the servlet container; there is no Tomcat thread pool to size.
spring.main.web-application-type=reactive

# --- Database connection ---
# Values come from the environment (.env in dev, real env vars in prod); DatabaseConfig reads
# these three properties rather than calling Dotenv directly, so the connection target is
# declared here like any other Spring property instead of being read inline in Java.
app.datasource.url=${POSTGRES_DB_URL}
app.datasource.username=${POSTGRES_DB_USER}
app.datasource.password=${POSTGRES_DB_PASSWORD}
# Runs src/main/resources/tables/*.sql on startup (CREATE TABLE IF NOT EXISTS, so it's safe to
# run against a database that already has some or all of the tables). Set to false to manage the
# schema entirely by hand instead — e.g. against a shared database the app shouldn't alter.
app.datasource.schema-init.enabled=true

# --- R2DBC connection pool ---
# The connection factory itself is built in DatabaseConfig from app.datasource.url above;
# these govern the pool that wraps it.
spring.r2dbc.pool.initial-size=5
spring.r2dbc.pool.max-size=20
spring.r2dbc.pool.max-idle-time=10m

# --- Redis: read-through cache and the SSE fan-out channel ---
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.timeout=2s
spring.data.redis.lettuce.pool.enabled=true
spring.data.redis.lettuce.pool.max-active=16
spring.data.redis.lettuce.pool.max-idle=8

# --- RabbitMQ: in-app notifications and outbound email ---
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest
# A message that keeps failing is retried with backoff and then dead-lettered rather than
# requeued forever at the head of the queue.
spring.rabbitmq.listener.simple.acknowledge-mode=auto
spring.rabbitmq.listener.simple.default-requeue-rejected=false
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.initial-interval=2s
spring.rabbitmq.listener.simple.retry.multiplier=2
spring.rabbitmq.listener.simple.retry.max-interval=30s
spring.rabbitmq.listener.simple.retry.max-attempts=4
spring.rabbitmq.listener.simple.concurrency=2
spring.rabbitmq.listener.simple.max-concurrency=8
spring.rabbitmq.template.retry.enabled=true

# --- File uploads ---
# WebFlux reads multipart parts off the request as they stream in.
spring.webflux.multipart.max-in-memory-size=1MB
spring.webflux.multipart.max-disk-usage-per-part=10MB
spring.webflux.multipart.max-parts=16

spring.devtools.restart.enabled=true
spring.devtools.livereload.enabled=true

# default time zone
user.default.timezone=Africa/Nairobi

# JWT
application.security.jwt.expiration=3600000
application.security.jwt.refresh-token.expiration=86400000

# OpenAPI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
