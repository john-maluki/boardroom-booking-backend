spring.application.name=boardroom-booking-backend

# Schema is created automatically on startup from src/main/resources/tables/*.sql (CREATE TABLE
# IF NOT EXISTS, so it's safe on every restart) — see DatabaseConfig and that directory's README.
# Set app.datasource.schema-init.enabled=false to turn that off.

# dev tools
spring.devtools.restart.enabled=true
spring.devtools.livereload.enabled=true

# embedded ldap server configuration — Boot starts this server either way; whether the app
# actually queries it depends on app.auth.directory-provider below (see EmbeddedLdapService)
spring.ldap.embedded.ldif=classpath:test-server.ldif
spring.ldap.embedded.base-dn=dc=springframework,dc=org
spring.ldap.embedded.port=9000
spring.ldap.embedded.url=ldap://localhost:9000/

# Which directory AuthService authenticates against. "embedded" (default) is the local test
# LDAP server above, seeded from test-server.ldif — safe to run with no network access and no
# real AD credentials. Change to "active-directory" to log in against the real KEMRI AD instead,
# while staying on the dev profile (sample data seeding, dev mail settings, etc. are unaffected —
# only which directory this one call goes to changes). Needs LDAP_PROD_SERVER_URL_1 and
# LDAP_PROD_DOMAIN_NAME set in .env; see ActiveDirectoryLdapService.
app.auth.directory-provider=embedded

# Debugging (optional, useful for troubleshooting)
spring.mail.properties.mail.debug=true

# data backup directory
backup.directory=/.kemri/backups/dev

# logging
#logging.level.org.springframework.r2dbc=DEBUG
#logging.level.io.r2dbc.postgresql.QUERY=DEBUG
