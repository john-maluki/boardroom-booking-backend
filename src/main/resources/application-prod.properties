spring.application.name=boardroom-booking-backend

# Schema is created automatically on startup from src/main/resources/tables/*.sql (CREATE TABLE
# IF NOT EXISTS, so it's safe on every restart) — see DatabaseConfig and that directory's README.
# Set app.datasource.schema-init.enabled=false to turn that off.

# Always the real directory — never the embedded test LDAP, regardless of what might be set
# elsewhere. See ActiveDirectoryLdapService / EmbeddedLdapService.
app.auth.directory-provider=active-directory

spring.devtools.restart.enabled=false
spring.devtools.livereload.enabled=false

# default time zone
user.default.timezone=Africa/Nairobi

# data backup directory
backup.directory=/.kemri/backups/prod
