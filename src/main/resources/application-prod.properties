spring.application.name=boardroom-booking-backend

# No automatic schema management: run the DDL under src/main/resources/tables/ by hand
# against the database before starting. There is no ddl-auto under R2DBC.

spring.devtools.restart.enabled=false
spring.devtools.livereload.enabled=false

# default time zone
user.default.timezone=Africa/Nairobi

# data backup directory
backup.directory=/.kemri/backups/prod
