plugins {
	id 'java'
	id 'org.springframework.boot' version '4.2.0'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'dev.johnmaluki'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	// --- Reactive web stack ---
	implementation 'org.springframework.boot:spring-boot-starter-webflux'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-validation'

	// --- Reactive persistence (R2DBC) ---
	implementation 'org.springframework.boot:spring-boot-starter-data-r2dbc'
	runtimeOnly 'org.postgresql:r2dbc-postgresql'

	// --- Redis: reactive cache + SSE fan-out bus ---
	implementation 'org.springframework.boot:spring-boot-starter-data-redis-reactive'
	// Lettuce's connection pool (enabled via spring.data.redis.lettuce.pool.* below) needs this
	// on the classpath; it is not a transitive dependency of the starter above.
	runtimeOnly 'org.apache.commons:commons-pool2'

	// --- RabbitMQ: in-app notifications + outbound email ---
	// Boot 4's spring-boot-starter-amqp targets AMQP 1.0; RabbitMQ has its own starter.
	implementation 'org.springframework.boot:spring-boot-starter-rabbitmq'

	// --- Directory services (blocking JNDI/LDAP, offloaded to boundedElastic) ---
	implementation 'org.springframework.boot:spring-boot-starter-data-ldap'
	implementation 'org.springframework.security:spring-security-ldap'
	implementation 'org.springframework.ldap:spring-ldap-core'
	implementation 'com.unboundid:unboundid-ldapsdk'

	// --- Mail + templating (used by the Rabbit email worker) ---
	implementation 'org.springframework.boot:spring-boot-starter-mail'
	implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'

	// --- API docs ---
	implementation 'org.springdoc:springdoc-openapi-starter-webflux-ui:3.2.1'

	// --- JWT ---
	implementation 'io.jsonwebtoken:jjwt-api:0.13.0'
	runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.13.0'
	runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.13.0'

	// --- Misc ---
	implementation 'io.github.cdimascio:dotenv-java:3.0.1'
	implementation 'net.datafaker:datafaker:2.5.1'
	// NTLM-authenticated Navision call; no reactive client supports NTLM.
	implementation 'org.apache.httpcomponents:httpclient:4.5.14'

	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'
	developmentOnly 'org.springframework.boot:spring-boot-devtools'

	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.security:spring-security-test'
	testImplementation 'io.projectreactor:reactor-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
	useJUnitPlatform()
}
